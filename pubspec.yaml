name: pogo_check_list_ota_labs
description: "A app to check my progress in PoGo"
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.7.2

dependencies:
  collection: ^1.19.1
  firebase_core: ^3.13.0
  firebase_database: ^11.3.5
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^2.6.1
  http: ^1.4.0
  intl: ^0.19.0
  nested: ^1.0.0
  percent_indicator: ^4.2.5
  riverpod: ^2.6.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/pokedex_gigantamax/
    - assets/pokedex_mega_evolutions/
    - assets/pokedex_sprites_shiny/
    - assets/pokedex_sprites/

flutter_native_splash:
  color: "#c64a34"
  image: assets/splash.png
  branding: assets/ota_bg.png
  image_dark: assets/splash.png
  branding_dark: assets/ota_bg.png
  android_12:
    image: assets/splash.png
    color: "#c64a34"
    branding: assets/ota_bg.png
    branding_dark: assets/ota_bg.png
  ios: true
