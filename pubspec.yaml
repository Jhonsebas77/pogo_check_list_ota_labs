name: pogo_check_list_ota_labs
description: "A app to check my progress in PoGo"
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.7.2

dependencies:
  firebase_core: ^3.13.0
  firebase_database: ^11.3.5
  flutter:
    sdk: flutter
  intl: ^0.19.0
  nested: ^1.0.0
  percent_indicator: ^4.2.5
  provider: ^6.1.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/pokedex_gigantamax/
    - assets/pokedex_sprites_shiny/
    - assets/pokedex_sprites/
