name: pogo_check_list_ota_labs
description: "A app to check my progress in PoGo"
publish_to: "none"

version: 1.0.0+38

environment:
  sdk: ^3.7.2

dependencies:
  collection: ^1.19.1
  file_saver: ^0.3.1
  firebase_core: ^4.0.0
  firebase_database: ^12.0.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^2.6.1
  http: ^1.4.0
  image_gallery_saver_plus: ^4.0.1
  intl: ^0.20.2
  nested: ^1.0.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  recase: ^4.1.0
  riverpod: ^2.6.1
  screenshot: ^3.0.0
  shimmer: ^3.0.0
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/pokedex_gigantamax/
    - assets/pokedex_mega_evolutions/
    - assets/pokedex_sprites_shiny/
    - assets/pokedex_sprites/
    - assets/types/

flutter_native_splash:
  color: "#c64a34"
  image: assets/splash.png
  branding: assets/branding.png
  image_dark: assets/splash.png
  branding_dark: assets/branding.png
  android_12:
    image: assets/splash.png
    color: "#c64a34"
    branding: assets/branding.png
    branding_dark: assets/branding.png
  ios: true
